<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32 OTA固件更新</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            font-weight: 600;
            color: #555;
        }
        
        .status-value {
            color: #333;
        }
        
        .upload-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.available {
            background: #28a745;
            color: white;
        }
        
        .badge.unavailable {
            background: #6c757d;
            color: white;
        }
        
        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
            display: none;
        }
        
        .instructions {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
        
        .instructions h3 {
            color: #1976D2;
            margin-bottom: 10px;
        }
        
        .instructions ol {
            margin-left: 20px;
            color: #555;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>? STM32 OTA固件更新</h1>
        <p class="subtitle">通过网页上传固件，单片机自动检测并更新</p>
        
        <!-- 当前固件状态 -->
        <div class="status-card">
            <h2 style="margin-bottom: 15px; color: #333;">? 固件状态</h2>
            <div class="status-item">
                <span class="status-label">当前版本</span>
                <span class="status-value" id="current-version">1.0.0</span>
            </div>
            <div class="status-item">
                <span class="status-label">固件大小</span>
                <span class="status-value" id="firmware-size">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">更新状态</span>
                <span class="status-value">
                    <span class="badge unavailable" id="update-status">暂无更新</span>
                </span>
            </div>
        </div>
        
        <!-- 上传新固件 -->
        <div class="upload-section">
            <h2 style="margin-bottom: 20px; color: #333;">? 上传新固件</h2>
            
            <form id="upload-form">
                <div class="form-group">
                    <label for="version">新版本号</label>
                    <input type="text" id="version" name="version" placeholder="例如: 1.1.0" required>
                </div>
                
                <div class="form-group">
                    <label for="firmware-file">选择固件文件 (.bin)</label>
                    <input type="file" id="firmware-file" name="firmware" accept=".bin" required>
                    <div class="file-info" id="file-info"></div>
                </div>
                
                <button type="submit" class="btn" id="upload-btn">
                    <span id="btn-text">上传并发布更新</span>
                </button>
            </form>
            
            <div class="message" id="message"></div>
        </div>
        
        <!-- 使用说明 -->
        <div class="instructions">
            <h3>? 使用说明</h3>
            <ol>
                <li>编译STM32工程，生成 <strong>.bin</strong> 固件文件</li>
                <li>在上方输入新版本号（如 1.1.0）</li>
                <li>选择编译好的 .bin 文件</li>
                <li>点击"上传并发布更新"按钮</li>
                <li>单片机会自动检测更新并下载固件</li>
                <li>下载完成后单片机会自动重启运行新固件</li>
            </ol>
        </div>
    </div>
    
    <script>
        // 页面加载时获取当前状态
        window.addEventListener('load', () => {
            updateStatus();
            // 定时刷新状态
            setInterval(updateStatus, 5000);
        });
        
        // 更新固件状态
        async function updateStatus() {
            try {
                const response = await fetch('/api/ota/status');
                const data = await response.json();
                
                document.getElementById('current-version').textContent = data.version;
                document.getElementById('firmware-size').textContent = 
                    data.size > 0 ? (data.size / 1024).toFixed(2) + ' KB' : '-';
                
                const statusBadge = document.getElementById('update-status');
                if (data.updateAvailable) {
                    statusBadge.textContent = '有新版本';
                    statusBadge.className = 'badge available';
                } else {
                    statusBadge.textContent = '暂无更新';
                    statusBadge.className = 'badge unavailable';
                }
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }
        
        // 文件选择
        document.getElementById('firmware-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const fileInfo = document.getElementById('file-info');
            
            if (file) {
                fileInfo.style.display = 'block';
                fileInfo.innerHTML = `
                    <strong>文件名:</strong> ${file.name}<br>
                    <strong>大小:</strong> ${(file.size / 1024).toFixed(2)} KB
                `;
            } else {
                fileInfo.style.display = 'none';
            }
        });
        
        // 表单提交
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const version = document.getElementById('version').value;
            const file = document.getElementById('firmware-file').files[0];
            
            if (!file) {
                showMessage('请选择固件文件', 'error');
                return;
            }
            
            formData.append('version', version);
            formData.append('firmware', file);
            
            const uploadBtn = document.getElementById('upload-btn');
            const btnText = document.getElementById('btn-text');
            
            // 禁用按钮
            uploadBtn.disabled = true;
            btnText.textContent = '上传中...';
            
            try {
                const response = await fetch('/api/ota/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`固件上传成功！版本: ${data.version}, 大小: ${(data.size/1024).toFixed(2)} KB`, 'success');
                    updateStatus();
                    // 重置表单
                    document.getElementById('upload-form').reset();
                    document.getElementById('file-info').style.display = 'none';
                } else {
                    showMessage('上传失败: ' + data.error, 'error');
                }
            } catch (error) {
                showMessage('上传失败: ' + error.message, 'error');
            } finally {
                uploadBtn.disabled = false;
                btnText.textContent = '上传并发布更新';
            }
        });
        
        // 显示消息
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
